name: HTB Status Monitor Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: htb-status-monitor-bot
  cancel-in-progress: false

jobs:
  check-machines:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check HTB machines and notify Discord
        run: python app.py
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FOOTER_MESSAGE: ${{ vars.FOOTER_MESSAGE }}

      - name: Save notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update HTB notification state"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No state changes to save."
          fi
